<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS Mobile Keygen</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            width: 100%;
            background-color: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.875rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-container {
            margin-top: 24px;
            display: none;
        }

        .result-box {
            background-color: var(--bg);
            border: 1px dashed var(--success);
            padding: 12px;
            border-radius: 6px;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.875rem;
            margin-bottom: 12px;
            user-select: all;
        }

        .error {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 8px;
            display: none;
        }

        .helper-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 Mobile Key Generator</h2>

    <div class="form-group">
        <label for="password">Your Password</label>
        <input type="password" id="password" placeholder="Your memorable password" autocomplete="off">
        <div class="helper-text">Same password as in the app source. Never leaves this page.</div>
    </div>

    <div class="form-group">
        <label for="hwid">Client HWID</label>
        <input type="text" id="hwid" placeholder="e.g. 398F-D2AB-6AFC-CFCD" autocomplete="off">
    </div>

    <div class="form-group">
        <label for="expiry">Expiry Date</label>
        <input type="date" id="expiry">
        <div class="helper-text">Leave blank for a 1-year default</div>
    </div>

    <div id="error" class="error"></div>

    <button onclick="generateKey()">Generate License Code</button>

    <div class="result-container" id="resultContainer">
        <label>Generated License Code (Tap to copy)</label>
        <div class="result-box" id="resultKey" onclick="copyToClipboard()"></div>
        <button style="background-color: var(--border);" onclick="copyToClipboard()">📋 Copy Code</button>
    </div>
</div>

<script>
    // ⚠️ MUST stay identical to LICENSE_SECRET in src-tauri/src/license.rs
    // ("RMSv1::" + OWNER_PASSWORD). Change both together.
    const LICENSE_SECRET = 'RMSv1::my-name-2005';

    // Set default date to 1 year from now
    const nextYear = new Date();
    nextYear.setFullYear(nextYear.getFullYear() + 1);
    document.getElementById('expiry').value = nextYear.toISOString().split('T')[0];

    // Mirrors normalize_code() in license.rs: strip non-alphanumerics, uppercase.
    function normalizeCode(s) {
        return s.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    }

    async function hmacSha256HexFirst8(message) {
        const encoder = new TextEncoder();
        const key = await crypto.subtle.importKey(
            'raw',
            encoder.encode(LICENSE_SECRET),
            { name: 'HMAC', hash: 'SHA-256' },
            false,
            ['sign']
        );
        const sig = await crypto.subtle.sign('HMAC', key, encoder.encode(message));
        const bytes = new Uint8Array(sig).slice(0, 8); // first 8 bytes, like the app
        return Array.from(bytes)
            .map(b => b.toString(16).padStart(2, '0').toUpperCase())
            .join('');
    }

    async function generateKey() {
        const password = document.getElementById('password').value.trim();
        const rawHwid = document.getElementById('hwid').value.trim();
        const expiryInput = document.getElementById('expiry').value.trim();
        const errorEl = document.getElementById('error');
        const resultContainer = document.getElementById('resultContainer');

        errorEl.style.display = 'none';
        resultContainer.style.display = 'none';

        if (!password) {
            errorEl.innerText = 'Error: Please enter your password';
            errorEl.style.display = 'block';
            return;
        }
        if (!rawHwid) {
            errorEl.innerText = 'Error: Please enter the HWID';
            errorEl.style.display = 'block';
            return;
        }

        // Check password against the secret's password part (case-insensitive,
        // like OWNER_PASSWORD check in license.rs).
        const expectedPassword = LICENSE_SECRET.split('::')[1] || '';
        if (password.toLowerCase() !== expectedPassword.toLowerCase()) {
            errorEl.innerText = 'Error: Incorrect password';
            errorEl.style.display = 'block';
            return;
        }

        // Default to 1 year from today if blank
        let expiry = expiryInput;
        if (!expiry || !/^\d{4}-\d{2}-\d{2}$/.test(expiry)) {
            const d = new Date();
            d.setFullYear(d.getFullYear() + 1);
            expiry = d.toISOString().split('T')[0];
        }

        try {
            // Payload matches the app exactly: NORMALIZED_HWID|YYYY-MM-DD
            const payload = `${normalizeCode(rawHwid)}|${expiry}`;
            const hex = await hmacSha256HexFirst8(payload);

            // Format as XXXX-XXXX-XXXX-XXXX
            const code = `${hex.slice(0, 4)}-${hex.slice(4, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}`;

            document.getElementById('resultKey').innerText = code;
            resultContainer.style.display = 'block';
        } catch (e) {
            errorEl.innerText = 'Error generating code. Your browser may not support WebCrypto.';
            errorEl.style.display = 'block';
            console.error(e);
        }
    }

    function copyToClipboard() {
        const key = document.getElementById('resultKey').innerText;
        navigator.clipboard.writeText(key).then(() => {
            const btn = document.querySelector('.result-container button');
            const originalText = btn.innerText;
            btn.innerText = '✅ Copied!';
            btn.style.backgroundColor = 'var(--success)';
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = 'var(--border)';
            }, 2000);
        });
    }
</script>

</body>
</html>
