<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS Mobile Keygen</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            background-color: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.875rem;
            box-sizing: border-box;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-container {
            margin-top: 24px;
            display: none;
        }

        .result-box {
            background-color: var(--bg);
            border: 1px dashed var(--success);
            padding: 12px;
            border-radius: 6px;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.875rem;
            margin-bottom: 12px;
            user-select: all;
        }

        .error {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 8px;
            display: none;
        }
        
        .helper-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 Mobile Key Generator</h2>
    
    <div class="form-group">
        <label for="hwid">Client HWID</label>
        <input type="text" id="hwid" placeholder="e.g. 398F-D2AB-6AFC-CFCD" autocomplete="off">
    </div>

    <div class="form-group">
        <label for="expiry">Expiry Date</label>
        <input type="date" id="expiry">
        <div class="helper-text">Leave blank for a 1-year default</div>
    </div>
    
    <div class="form-group">
        <label for="privateKey">Your Private Key (PEM format)</label>
        <textarea id="privateKey" placeholder="-----BEGIN PRIVATE KEY-----..."></textarea>
        <div class="helper-text">Stored safely in memory, never sent anywhere.</div>
    </div>

    <div id="error" class="error"></div>

    <button onclick="generateKey()">Generate License Key</button>

    <div class="result-container" id="resultContainer">
        <label>Generated License Key (Tap to copy)</label>
        <div class="result-box" id="resultKey" onclick="copyToClipboard()"></div>
        <button style="background-color: var(--border);" onclick="copyToClipboard()">📋 Copy Key</button>
    </div>
</div>

<script>
    // Set default date to 1 year from now
    const nextYear = new Date();
    nextYear.setFullYear(nextYear.getFullYear() + 1);
    document.getElementById('expiry').value = nextYear.toISOString().split('T')[0];

    // Helper: Base64 to ArrayBuffer
    function base64ToArrayBuffer(base64) {
        const binaryString = window.atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes.buffer;
    }

    // Helper: ArrayBuffer to Base64
    function arrayBufferToBase64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.byteLength; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return window.btoa(binary);
    }

    // Parse PEM string to ArrayBuffer (PKCS#8 format)
    function parsePemToBuffer(pem) {
        const b64 = pem
            .replace(/-----BEGIN (.*)-----/, "")
            .replace(/-----END (.*)-----/, "")
            .replace(/\s+/g, "");
        return base64ToArrayBuffer(b64);
    }

    async function generateKey() {
        const hwid = document.getElementById('hwid').value.trim();
        const expiry = document.getElementById('expiry').value.trim();
        const pemStr = document.getElementById('privateKey').value.trim();
        const errorEl = document.getElementById('error');
        const resultContainer = document.getElementById('resultContainer');
        
        errorEl.style.display = 'none';
        resultContainer.style.display = 'none';

        if (!hwid) {
            errorEl.innerText = "Error: Please enter the HWID";
            errorEl.style.display = 'block';
            return;
        }
        if (!pemStr) {
            errorEl.innerText = "Error: Please paste your private_key.pem";
            errorEl.style.display = 'block';
            return;
        }

        try {
            // Import the Private Key
            const keyBuffer = parsePemToBuffer(pemStr);
            const privateKey = await crypto.subtle.importKey(
                "pkcs8",
                keyBuffer,
                {
                    name: "RSASSA-PKCS1-v1_5",
                    hash: "SHA-256",
                },
                false,
                ["sign"]
            );

            // Construct payload EXACTLY as the Node.js script does
            const payload = `${hwid}|${expiry}`;
            const encoder = new TextEncoder();
            const data = encoder.encode(payload);

            // Sign the payload
            const signatureBuffer = await crypto.subtle.sign(
                "RSASSA-PKCS1-v1_5",
                privateKey,
                data
            );

            // Encode exactly like the Node.js script: Base64( payload + \n + Base64(signature) )
            const signatureB64 = arrayBufferToBase64(signatureBuffer);
            const combined = `${payload}\n${signatureB64}`;
            const licenseKey = window.btoa(unescape(encodeURIComponent(combined)));
            
            document.getElementById('resultKey').innerText = licenseKey;
            resultContainer.style.display = 'block';

        } catch (e) {
            errorEl.innerText = "Error generating key: Invalid Private Key format. Ensure it is a valid PKCS#8 PEM.";
            errorEl.style.display = 'block';
            console.error(e);
        }
    }

    function copyToClipboard() {
        const key = document.getElementById('resultKey').innerText;
        navigator.clipboard.writeText(key).then(() => {
            const btn = document.querySelector('.result-container button');
            const originalText = btn.innerText;
            btn.innerText = "✅ Copied!";
            btn.style.backgroundColor = "var(--success)";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = "var(--border)";
            }, 2000);
        });
    }
</script>

</body>
</html>
